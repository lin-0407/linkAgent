services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --max-connections=30
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-link_agent_root_password}
      MYSQL_DATABASE: link_agent
      MYSQL_USER: ${MYSQL_USER:-link_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-link_agent_password}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # 每次启动自动执行 init.sql，确保新增表/种子提示词在已有数据库中也生效
  db-init:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-link_agent_root_password}
    volumes:
      - ./backend/src/main/resources/sql/init.sql:/init.sql:ro
    entrypoint: ["sh", "-c", "mysql -h mysql -u root -p\"$$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 link_agent < /init.sql && echo 'init.sql executed successfully'"]
    restart: "no"

  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  backend:
    build:
      # 后端运行时需执行根目录 scripts 下的受控采集脚本，构建上下文必须覆盖该目录。
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/link_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
      DB_USERNAME: ${MYSQL_USER:-link_agent}
      DB_PASSWORD: ${MYSQL_PASSWORD:-link_agent_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LINKAGENT_AES_KEY: ${LINKAGENT_AES_KEY:-}
      LLM_GUARD_ENABLED: ${LLM_GUARD_ENABLED:-true}
      LLM_GUARD_MAX_PROMPT_CHARS: ${LLM_GUARD_MAX_PROMPT_CHARS:-30000}
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-none}
      # Compose 内通过服务名访问 Milvus，不能沿用宿主机或开发机地址。
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_USERNAME: ${MILVUS_USERNAME:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      MILVUS_DATABASE_NAME: ${MILVUS_DATABASE_NAME:-default}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-creator_feedback_evidence}
      MILVUS_INITIALIZE_SCHEMA: ${MILVUS_INITIALIZE_SCHEMA:-true}
      MILVUS_EMBEDDING_DIMENSION: ${MILVUS_EMBEDDING_DIMENSION:-1024}
      EMBEDDING_MODEL_TYPE: ${EMBEDDING_MODEL_TYPE:-none}
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY:-}
      LLM_EMBEDDING_BASE_URL: ${LLM_EMBEDDING_BASE_URL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_EMBEDDING_DIMENSIONS: ${LLM_EMBEDDING_DIMENSIONS:-1024}
      CREATOR_FEEDBACK_RAG_ENABLED: ${CREATOR_FEEDBACK_RAG_ENABLED:-false}
      CREATOR_FEEDBACK_RAG_TOP_K: ${CREATOR_FEEDBACK_RAG_TOP_K:-8}
      CREATOR_FEEDBACK_RAG_MAX_INDEX_ITEMS: ${CREATOR_FEEDBACK_RAG_MAX_INDEX_ITEMS:-300}
      KNOWLEDGE_RAG_ENABLED: ${KNOWLEDGE_RAG_ENABLED:-false}
      KNOWLEDGE_RAG_COLLECTION_NAME: ${KNOWLEDGE_RAG_COLLECTION_NAME:-creator_reference_video}
      KNOWLEDGE_RAG_INDEX_BATCH_SIZE: ${KNOWLEDGE_RAG_INDEX_BATCH_SIZE:-10}
      KNOWLEDGE_RAG_INITIALIZE_SCHEMA: ${KNOWLEDGE_RAG_INITIALIZE_SCHEMA:-true}
      CREATOR_MEDIA_ENABLED: ${CREATOR_MEDIA_ENABLED:-false}
      CREATOR_MEDIA_FFPROBE_PATH: ${CREATOR_MEDIA_FFPROBE_PATH:-ffprobe}
      CREATOR_MEDIA_FFMPEG_PATH: ${CREATOR_MEDIA_FFMPEG_PATH:-ffmpeg}
      CREATOR_MEDIA_PROBE_TIMEOUT: ${CREATOR_MEDIA_PROBE_TIMEOUT:-30s}
      CREATOR_MEDIA_FFMPEG_TIMEOUT: ${CREATOR_MEDIA_FFMPEG_TIMEOUT:-2h}
      CREATOR_MEDIA_PROVIDER_READ_TTL: ${CREATOR_MEDIA_PROVIDER_READ_TTL:-5m}
      CREATOR_MEDIA_WORK_ROOT: /var/lib/linkagent-media-work
      CREATOR_MEDIA_PRICING_VERSION: ${CREATOR_MEDIA_PRICING_VERSION:-2026-07-12-config-v1}
      CREATOR_MEDIA_FLASH_INPUT_USD_PER_MILLION_TOKENS: ${CREATOR_MEDIA_FLASH_INPUT_USD_PER_MILLION_TOKENS:-0.022}
      CREATOR_MEDIA_FLASH_OUTPUT_USD_PER_MILLION_TOKENS: ${CREATOR_MEDIA_FLASH_OUTPUT_USD_PER_MILLION_TOKENS:-0.215}
      CREATOR_MEDIA_PLUS_INPUT_USD_PER_MILLION_TOKENS: ${CREATOR_MEDIA_PLUS_INPUT_USD_PER_MILLION_TOKENS:-0.42}
      CREATOR_MEDIA_PLUS_OUTPUT_USD_PER_MILLION_TOKENS: ${CREATOR_MEDIA_PLUS_OUTPUT_USD_PER_MILLION_TOKENS:-1.25}
      CREATOR_MEDIA_ASR_USD_PER_SECOND: ${CREATOR_MEDIA_ASR_USD_PER_SECOND:-0.000035}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      CREATOR_MEDIA_ASR_MODEL: ${CREATOR_MEDIA_ASR_MODEL:-qwen3-asr-flash-filetrans}
      CREATOR_MEDIA_VIDEO_MODEL: ${CREATOR_MEDIA_VIDEO_MODEL:-qwen3-vl-flash}
      CREATOR_MEDIA_VIDEO_FPS: ${CREATOR_MEDIA_VIDEO_FPS:-0.2}
      CREATOR_MEDIA_PREFLIGHT_POLL_INTERVAL_MS: ${CREATOR_MEDIA_PREFLIGHT_POLL_INTERVAL_MS:-2000}
      CREATOR_MEDIA_PREFLIGHT_LEASE_DURATION: ${CREATOR_MEDIA_PREFLIGHT_LEASE_DURATION:-90s}
      CREATOR_MEDIA_PREFLIGHT_MAX_ATTEMPTS: ${CREATOR_MEDIA_PREFLIGHT_MAX_ATTEMPTS:-3}
      CREATOR_MEDIA_PREFLIGHT_PROVIDER_POLL_INTERVAL: ${CREATOR_MEDIA_PREFLIGHT_PROVIDER_POLL_INTERVAL:-5s}
      CREATOR_MEDIA_ASR_CONNECT_TIMEOUT: ${CREATOR_MEDIA_ASR_CONNECT_TIMEOUT:-10s}
      CREATOR_MEDIA_ASR_READ_TIMEOUT: ${CREATOR_MEDIA_ASR_READ_TIMEOUT:-30s}
      CREATOR_MEDIA_VIDEO_READ_TIMEOUT: ${CREATOR_MEDIA_VIDEO_READ_TIMEOUT:-10m}
      MEDIA_S3_INTERNAL_ENDPOINT: ${MEDIA_S3_INTERNAL_ENDPOINT:-https://s3.oss-cn-hongkong.aliyuncs.com}
      MEDIA_S3_BROWSER_ENDPOINT: ${MEDIA_S3_BROWSER_ENDPOINT:-https://s3.oss-cn-hongkong.aliyuncs.com}
      MEDIA_S3_PROVIDER_ENDPOINT: ${MEDIA_S3_PROVIDER_ENDPOINT:-https://s3.oss-cn-hongkong.aliyuncs.com}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-aws-global}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      SHORT_TERM_MEMORY_STORE_TYPE: redis
      SUMMARY_MEMORY_ENABLED: ${SUMMARY_MEMORY_ENABLED:-false}
      SUMMARY_MEMORY_TRIGGER_MESSAGE_COUNT: ${SUMMARY_MEMORY_TRIGGER_MESSAGE_COUNT:-8}
      SUMMARY_MEMORY_RETAINED_MESSAGE_COUNT: ${SUMMARY_MEMORY_RETAINED_MESSAGE_COUNT:-2}
      TOOL_EXECUTION_TIMEOUT_SECONDS: ${TOOL_EXECUTION_TIMEOUT_SECONDS:-10}
      TOOL_EXECUTION_MAX_RETRIES: ${TOOL_EXECUTION_MAX_RETRIES:-0}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - media-work:/var/lib/linkagent-media-work

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  milvus-data:
  etcd-data:
  media-work:
