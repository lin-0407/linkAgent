server:
  port: 8080

spring:
  application:
    name: link-agent

  # ========== MySQL ==========
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/link_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:link_agent}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ========== Redis ==========
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # ========== Spring AI / LLM ==========
  ai:
    vectorstore:
      type: ${VECTOR_STORE_TYPE:none}
    openai:
      api-key: ${LLM_API_KEY:missing}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}

agent:
  tool:
    execution:
      timeout-seconds: ${TOOL_EXECUTION_TIMEOUT_SECONDS:10}
      max-retries: ${TOOL_EXECUTION_MAX_RETRIES:0}
  memory:
    short-term:
      # memory：进程内 Map；redis：共享 Redis List
      store-type: ${SHORT_TERM_MEMORY_STORE_TYPE:memory}
    summary:
      enabled: ${SUMMARY_MEMORY_ENABLED:false}
      trigger-message-count: ${SUMMARY_MEMORY_TRIGGER_MESSAGE_COUNT:8}
      retained-message-count: ${SUMMARY_MEMORY_RETAINED_MESSAGE_COUNT:2}

