server:
  port: 8080
  # HTTPS 反向代理存在时，让 request.isSecure() 正确识别外层协议。
  # 设置为 framework 后，Spring 会解析 X-Forwarded-Proto / X-Forwarded-Ssl，
  # 从而只在 HTTPS 请求中给媒体会话 Cookie 设置 Secure；HTTP 演示环境不依赖此项。
  forward-headers-strategy: framework

spring:
  application:
    name: link-agent

  servlet:
    multipart:
      # 补充背景文档服务层按 10MB/个校验；这里同步前置限制，避免请求先被 Spring 拦截。
      max-file-size: 10MB
      # 多文件上传需要总请求上限高于单文件上限；业务层仍逐文件校验格式和大小。
      max-request-size: 32MB
  # ========== MySQL ==========
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ========== Redis ==========
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # ========== Spring AI / LLM ==========
  ai:
    # 模型能力开关：embedding 默认 none，显式关闭 OpenAI Embedding 自动配置。
    # 该自动配置的条件是 @ConditionalOnProperty(matchIfMissing=true)，不显式写 none 会默认开启，
    # 导致演示环境创建无用的 Embedding Bean；只有 EMBEDDING_MODEL_TYPE=openai 时才激活向量链路。
    model:
      embedding: ${EMBEDDING_MODEL_TYPE:none}
    vectorstore:
      # type=none 时 Milvus 自动配置不激活（其条件 havingValue=milvus），避免早期遇到的 Milvus 启动超时问题
      type: ${VECTOR_STORE_TYPE:none}
      # 下面 milvus 配置仅当 VECTOR_STORE_TYPE=milvus 时被读取；默认 none 时只是占位，不会连接 Milvus
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
        database-name: ${MILVUS_DATABASE_NAME:default}
        collection-name: ${MILVUS_COLLECTION_NAME:creator_feedback_evidence}
        # 首次建集合设 true，建好后改回 false，避免每次启动都尝试初始化 schema
        initialize-schema: ${MILVUS_INITIALIZE_SCHEMA:false}
        # 必须与 LLM_EMBEDDING_DIMENSIONS 一致，否则写入维度与集合维度冲突
        embedding-dimension: ${MILVUS_EMBEDDING_DIMENSION:1024}
    openai:
      api-key: ${LLM_API_KEY}
      base-url: ${LLM_BASE_URL}
      chat:
        options:
          model: ${LLM_MODEL}
      # 自动补全专用轻量模型：输入框 AI 按钮用，快速且便宜
      autofill-model: ${AUTOFILL_LLM_MODEL:${LLM_MODEL}}
      # Embedding 默认复用 LLM 网关凭证；单独留 KEY/BASE_URL 是为了能切换到独立的 embedding 服务
      embedding:
        api-key: ${LLM_EMBEDDING_API_KEY:${LLM_API_KEY}}
        base-url: ${LLM_EMBEDDING_BASE_URL:${LLM_BASE_URL}}
        # Spring AI 默认 embeddings-path 是 /v1/embeddings；DashScope 的 OpenAI 兼容路径多一层 compatible-mode。
        # 这里单独暴露 path，是为了避免把 /compatible-mode/v1 写进 base-url 后被 RestClient 的绝对路径规则覆盖，导致请求打到错误地址而 404。
        embeddings-path: ${LLM_EMBEDDING_PATH:/compatible-mode/v1/embeddings}
        options:
          model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${LLM_EMBEDDING_DIMENSIONS:1536}
    mcp:
      client:
        enabled: false
        name: link-agent
        version: 0.0.1
        initialized: true
        request-timeout: 30s
        type: sync
        root-change-notification: false
        toolcallback:
          enabled: true
        stdio:
          # servers-configuration: ${MCP_STDIO_SERVERS_CONFIGURATION:classpath:mcp-servers.json}
          # connections:
          #   例子：
          #   github:
          #     command: npx
          #     args:
          #       - -y
          #       - @modelcontextprotocol/server-github
          #     env:
          #       GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN:}
        streamable-http:
          # connections:
          #   例子：
          #   docs:
          #     url: http://localhost:3001
          #     endpoint: /mcp

agent:
  tool:
    web-search:
      # 默认关闭；开启后先尝试 Bing RSS，失败时自动回退 DuckDuckGo HTML。
      enabled: ${WEB_SEARCH_ENABLED:false}
      bing-base-url: ${WEB_SEARCH_BING_BASE_URL:https://cn.bing.com}
      duckduckgo-base-url: ${WEB_SEARCH_DUCKDUCKGO_BASE_URL:https://html.duckduckgo.com}
      # 单页正文超过 2000 字时，合并为一次轻量模型调用压缩，失败后自动保留原文。
      compression-enabled: ${WEB_SEARCH_COMPRESSION_ENABLED:true}
      compression-model: ${WEB_SEARCH_COMPRESSION_MODEL:deepseek-v4-flash}
    execution:
      timeout-seconds: ${TOOL_EXECUTION_TIMEOUT_SECONDS:10}
      max-retries: ${TOOL_EXECUTION_MAX_RETRIES:0}
  kernel:
    # 默认启用结构化 ReAct：每步输出 ReActStep 对象，减少对 Thought:/Action: 文本格式的依赖。
    structured:
      enabled: ${AGENT_KERNEL_STRUCTURED_ENABLED:true}
  llm:
    guard:
      enabled: ${LLM_GUARD_ENABLED:true}
      max-prompt-chars: ${LLM_GUARD_MAX_PROMPT_CHARS:30000}

  memory:
    short-term:
      # memory：进程内 Map；redis：共享 Redis List
      store-type: ${SHORT_TERM_MEMORY_STORE_TYPE:memory}
    summary:
      enabled: ${SUMMARY_MEMORY_ENABLED:false}
      trigger-message-count: ${SUMMARY_MEMORY_TRIGGER_MESSAGE_COUNT:8}
      retained-message-count: ${SUMMARY_MEMORY_RETAINED_MESSAGE_COUNT:2}

# ========== MyBatis ==========
mybatis:
  configuration:
    # 自动将列名 task_id 映射到属性 taskId，数据库规范下不需要手写 @Results
    map-underscore-to-camel-case: true

creator:
  # ========== 阶段 7 P0：私有媒体能力 ==========
  # 注意：媒体能力默认关闭。只有 OSS 和后续视频分析 Provider 配置完成后才显式开启，
  # 避免未配置对象存储时暴露不可用的大文件上传入口。
  media:
    # 媒体链路总开关；设为 true 后才加载所有媒体相关 Bean（S3 客户端、Filter、Controller）。
    enabled: ${CREATOR_MEDIA_ENABLED:false}
    # 单文件字节数上限，默认 1.5GB = 1500000000 字节。
    # P0 前后端共享同一固定值，不对外开放环境变量调整，
    # 避免服务端和浏览器端的分片协议不一致导致上传失败。
    max-file-bytes: 1500000000
    # 单视频时长上限毫秒，默认 1800000ms = 30 分钟。
    # P0-1 阶段 ffprobe 探测后生效；P0-0 阶段仅声明不校验。
    max-duration-ms: 1800000
    # 未发布成片及其派生媒体的保留天数，超期由定时任务清理原片对象。
    unpublished-retention-days: ${CREATOR_MEDIA_UNPUBLISHED_RETENTION_DAYS:30}
    # ----- 上传子配置 -----
    upload:
      # 单分片目标字节数，默认 16 MiB = 16777216。
      # 固定值原因：分片大小是客户端和 OSS 之间的协议参数，
      # 服务端调整后已创建的上传会话会出现分片大小不一致。
      # 下限 5 MiB（S3 Multipart Upload 最小分片），上限由 totalParts=10000 与文件大小推导。
      part-size-bytes: 16777216
      # 单次分片签名批量上限；默认 20，与前端并发上传数对齐。
      max-sign-batch: 20
      # 预签名 URL 有效期；默认 15m，浏览器必须在此时间内完成分片 PUT。
      presign-ttl: ${CREATOR_MEDIA_UPLOAD_PRESIGN_TTL:15m}
      # 上传会话最大存活时间；默认 24h，超时未完成则自动标记 EXPIRED。
      abandoned-ttl: ${CREATOR_MEDIA_UPLOAD_ABANDONED_TTL:24h}
  pre-publish:
    # 默认启用发布前优化 Agent 链路；演示或排障时可通过 PRE_PUBLISH_AGENT_ENABLED=false 回退旧直连 LLM 链路。
    agent:
      enabled: ${PRE_PUBLISH_AGENT_ENABLED:true}
  feedback:
    # ========== 创作者反馈追问 RAG（阶段 4.13） ==========
    # 业务开关独立于 spring.ai 基础设施开关：即使 Milvus/Embedding 连上，也只有 enabled=true 才让追问走向量检索，
    # 避免“基础设施就绪但业务还没准备好”时追问链路被动切到 RAG。
    rag:
      enabled: ${CREATOR_FEEDBACK_RAG_ENABLED:false}
      # 单次向量检索返回的候选证据上限
      top-k: ${CREATOR_FEEDBACK_RAG_TOP_K:8}
      # 向量命中数低于该值时合并 SQL 证据兜底，避免召回过少导致回答缺证据
      min-vector-hit-count: ${CREATOR_FEEDBACK_RAG_MIN_VECTOR_HIT_COUNT:3}
      # 单次重建索引最多写入的明细条数，保护演示环境 Embedding 成本
      max-index-items: ${CREATOR_FEEDBACK_RAG_MAX_INDEX_ITEMS:300}
      # 重建索引时是否默认包含噪声明细
      include-noise-default: ${CREATOR_FEEDBACK_RAG_INCLUDE_NOISE_DEFAULT:false}

# ========== 跨分区视频案例知识库 RAG（阶段 5.1） ==========
# 与反馈 RAG 完全独立的开关，默认关闭：关闭时不连 Milvus、不调 Embedding，案例导入与列表照常工作（不依赖向量库）。
# Milvus 连接复用上面的 MILVUS_* 同一套环境变量；只是集合名与维度不同，做到专用集合物理隔离。
knowledge:
  quality:
    # 分区相对质量分需要足够同赛道样本；低于该数量时只保存单视频原始分，避免 60/0/100 的小样本跳变误导展示。
    min-reliable-sample-size: ${KNOWLEDGE_QUALITY_MIN_RELIABLE_SAMPLE_SIZE:5}
  rag:
    enabled: ${KNOWLEDGE_RAG_ENABLED:false}
    collection-name: ${KNOWLEDGE_RAG_COLLECTION_NAME:creator_reference_video}
    # 5.2c 子集合：存优质评论弹幕原文（small 端），与父集合物理隔离；与父集合共用同一 Milvus 连接与维度，仅集合名不同
    child-collection-name: ${KNOWLEDGE_RAG_CHILD_COLLECTION_NAME:creator_reference_video_item}
    # 主题中块集合：存标题包装 / 内容定位 / 观众反馈主题块，位于父卡片和原始子条目之间
    chunk-collection-name: ${KNOWLEDGE_RAG_CHUNK_COLLECTION_NAME:creator_reference_video_chunk}
    # 必须与 Embedding 输出维度严格一致；启用知识库时请把 LLM_EMBEDDING_DIMENSIONS 一并设为 1024（Qwen text-embedding-v4 推荐值）
    embedding-dimension: ${LLM_EMBEDDING_DIMENSIONS:1024}
    # Qwen text-embedding-v3/v4 OpenAI 兼容模式单批硬上限为 10，知识库索引批次不能照抄反馈侧的 25
    index-batch-size: ${KNOWLEDGE_RAG_INDEX_BATCH_SIZE:10}
    # 首次启用时自动建集合；建好后可设 false 省去每次启动的 schema 检查
    initialize-schema: ${KNOWLEDGE_RAG_INITIALIZE_SCHEMA:true}
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      username: ${MILVUS_USERNAME:}
      password: ${MILVUS_PASSWORD:}
      database-name: ${MILVUS_DATABASE_NAME:default}
    # 重排序（5.2e）：qwen3-rerank 精排，默认关（opt-in，每次检索额外一次外部调用）。
    # 注意 base-url 是 compatible-api（rerank 专用），不是 chat 的 compatible-mode；老 gte-rerank 已于 2026-05-30 下线。
    rerank:
      enabled: ${KNOWLEDGE_RAG_RERANK_ENABLED:false}
      model: ${KNOWLEDGE_RAG_RERANK_MODEL:qwen3-rerank}
      base-url: ${KNOWLEDGE_RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1}
      # 默认复用 LLM 网关同一个 DashScope Key；如 rerank 用独立 Key，单独配 KNOWLEDGE_RAG_RERANK_API_KEY
      api-key: ${KNOWLEDGE_RAG_RERANK_API_KEY:${LLM_API_KEY:}}
      candidate-pool-size: ${KNOWLEDGE_RAG_RERANK_POOL:20}
      timeout-ms: ${KNOWLEDGE_RAG_RERANK_TIMEOUT_MS:10000}
    # 原生 dense+BM25 混合检索（5.2d）：默认关，需 Milvus 服务端 ≥2.5（BM25 是服务端能力）+ 自建 schema 集合 + 重灌。
    # 与 enabled 双开关：还需 knowledge.rag.enabled=true。复用上面 milvus.* 同一套连接（v2 client 用 uri 形式）。
    hybrid:
      enabled: ${KNOWLEDGE_RAG_HYBRID_ENABLED:false}
      collection-name: ${KNOWLEDGE_RAG_HYBRID_COLLECTION_NAME:creator_reference_video_hybrid}
      # 子条目 hybrid 集合（5.2d-3）：子条目原文的 dense+BM25 集合，与父 hybrid 集合物理隔离
      child-collection-name: ${KNOWLEDGE_RAG_HYBRID_CHILD_COLLECTION_NAME:creator_reference_video_item_hybrid}
      # BM25 text 字段 VarChar 上限（中文多字节，给足以防长卡片插入越界）
      text-max-length: ${KNOWLEDGE_RAG_HYBRID_TEXT_MAX_LENGTH:65535}
      # text 字段分析器：中文用 chinese（无空格中文需中文分词，否则 BM25 召回差）；开库自测确认该分析器可建
      analyzer-type: ${KNOWLEDGE_RAG_HYBRID_ANALYZER:chinese}

# ========== Langfuse (可观测) ==========
# langfuse:
#   public-key: ${LANGFUSE_PUBLIC_KEY:}
#   secret-key: ${LANGFUSE_SECRET_KEY:}
#   host: ${LANGFUSE_HOST:http://localhost:3000}

# ========== LLM 多 Provider 回退链（方案四） ==========
# 主 Provider 走 spring.ai.openai.* 自动配置；以下为备用 Provider 列表。
# 主 Provider 调用失败时按配置顺序依次尝试备用 Provider。
llm:
  fallback:
    enabled: ${LLM_FALLBACK_ENABLED:false}
    cooldown-seconds: ${LLM_FALLBACK_COOLDOWN_SECONDS:60}
    providers:
      - name: ${LLM_FALLBACK_1_NAME:}
        base-url: ${LLM_FALLBACK_1_BASE_URL:}
        api-key: ${LLM_FALLBACK_1_API_KEY:}
        model: ${LLM_FALLBACK_1_MODEL:}
      - name: ${LLM_FALLBACK_2_NAME:}
        base-url: ${LLM_FALLBACK_2_BASE_URL:}
        api-key: ${LLM_FALLBACK_2_API_KEY:}
        model: ${LLM_FALLBACK_2_MODEL:}

# ========== Milvus (向量库) ==========
# milvus:
#   host: ${MILVUS_HOST:localhost}
#   port: ${MILVUS_PORT:19530}

# ========== 应用密钥（P1-4：API Key 加密存储） ==========
linkagent:
  secret:
    # AES-256-GCM 加密密钥（Base64 编码的 32 字节密钥）。
    # 生产环境必须通过 LINKAGENT_AES_KEY 环境变量注入，默认值为空表示未配置。
    # 生成方式：openssl rand -base64 32
    aes-key: ${LINKAGENT_AES_KEY:}

# ========== 阶段 7 P0：私有媒体对象存储（S3 兼容协议） ==========
# P0 默认连接阿里云 OSS 香港地域的 S3 兼容接口。
# 三个端点（internal / browser / provider）的默认值相同，实际部署时可根据网络拓扑分别覆盖：
#   - internalEndpoint：后端服务访问 OSS，部署在同 Region 时可改为内网地址节省流量
#   - browserEndpoint：浏览器直传 OSS，必须是公网可达地址（预签名 URL 的 host）
#   - providerEndpoint：云端 AI 模型访问 OSS（后续视频分析场景），默认公网
storage:
  s3:
    # 香港地域的选择原因：中国大陆 OSS 新用户必须绑定自定义数据域名才能使用 S3 兼容接口，
    # 香港地域目前无此限制，且延迟对国内用户可接受。真实回源效果仍需 P0-0 实测验证。
    internal-endpoint: ${MEDIA_S3_INTERNAL_ENDPOINT:https://s3.oss-cn-hongkong.aliyuncs.com}
    browser-endpoint: ${MEDIA_S3_BROWSER_ENDPOINT:https://s3.oss-cn-hongkong.aliyuncs.com}
    provider-endpoint: ${MEDIA_S3_PROVIDER_ENDPOINT:https://s3.oss-cn-hongkong.aliyuncs.com}
    # S3 签名使用的 Region 标识。
    # 阿里云官方 Java SDK 2.x 示例与文档均使用 aws-global，
    # 改为其他值（如 oss-cn-hongkong）可能导致签名校验失败。
    region: ${MEDIA_S3_REGION:aws-global}
    # RAM 用户 AccessKey；生产环境必须通过环境变量注入，默认值为空。
    # 该 RAM 用户需要对指定 Bucket 有 PutObject、GetObject、DeleteObject 和 Multipart Upload 权限。
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
    # OSS Bucket 名称（如 linkagent-media）；权限策略应限制该 Bucket 为私有读写。
    bucket: ${MEDIA_S3_BUCKET:}
    # 寻址模式：阿里云 OSS 只支持 Virtual Hosted-Style（bucket 作为域名子域），
    # 不支持 MinIO 等自建服务常用的 Path-Style（bucket 作为 URL 路径段）。
    # 设为 true 时若 endpoint 包含 aliyuncs.com，validateConfigured() 会主动拒绝启动。
    path-style-access: ${MEDIA_S3_PATH_STYLE_ACCESS:false}
    # AWS Chunked Encoding（aws-chunked）：一种流式上传的传输编码方式。
    # 阿里云 OSS 不支持此编码，Java SDK 2.x 必须显式关闭，
    # 否则签名校验失败（OSS 收到 aws-chunked 数据后返回 SignatureDoesNotMatch）。
    chunked-encoding-enabled: ${MEDIA_S3_CHUNKED_ENCODING_ENABLED:false}
