server:
  port: 8080

spring:
  application:
    name: link-agent

  servlet:
    multipart:
      max-file-size: 5MB
  # ========== MySQL ==========
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ========== Redis ==========
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # ========== Spring AI / LLM ==========
  ai:
    vectorstore:
      type: ${VECTOR_STORE_TYPE:none}
    openai:
      api-key: ${LLM_API_KEY}
      base-url: ${LLM_BASE_URL}
      chat:
        options:
          model: ${LLM_MODEL}
    mcp:
      client:
        enabled: false
        name: link-agent
        version: 0.0.1
        initialized: true
        request-timeout: 30s
        type: sync
        root-change-notification: false
        toolcallback:
          enabled: true
        stdio:
          # servers-configuration: ${MCP_STDIO_SERVERS_CONFIGURATION:classpath:mcp-servers.json}
          # connections:
          #   例子：
          #   github:
          #     command: npx
          #     args:
          #       - -y
          #       - @modelcontextprotocol/server-github
          #     env:
          #       GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN:}
        streamable-http:
          # connections:
          #   例子：
          #   docs:
          #     url: http://localhost:3001
          #     endpoint: /mcp

agent:
  llm:
    guard:
      enabled: ${LLM_GUARD_ENABLED:true}
      max-prompt-chars: ${LLM_GUARD_MAX_PROMPT_CHARS:30000}
  tool:
    execution:
      timeout-seconds: ${TOOL_EXECUTION_TIMEOUT_SECONDS:10}
      max-retries: ${TOOL_EXECUTION_MAX_RETRIES:0}
  memory:
    short-term:
      # memory：进程内 Map；redis：共享 Redis List
      store-type: ${SHORT_TERM_MEMORY_STORE_TYPE:memory}
    summary:
      enabled: ${SUMMARY_MEMORY_ENABLED:false}
      trigger-message-count: ${SUMMARY_MEMORY_TRIGGER_MESSAGE_COUNT:8}
      retained-message-count: ${SUMMARY_MEMORY_RETAINED_MESSAGE_COUNT:2}

