# 为什么需要这个文件：
# 主 application.yml 里 DB_URL、LLM_MODEL 这类占位符故意不给默认值，避免部署时静默连到错误地址或模型；
# 但 @SpringBootTest 要启动完整上下文，这些占位符必须有值，否则 contextLoads 会直接失败。
# 这里只提供测试用的假值。操作系统环境变量优先级高于配置文件，
# 作者本机或 CI 设了真实值时仍然以真实值为准，真实密钥不会进仓库。
LLM_API_KEY=test-api-key
LLM_BASE_URL=http://127.0.0.1:1
LLM_MODEL=test-model
DB_URL=jdbc:mysql://127.0.0.1:3306/link_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
DB_USERNAME=test
DB_PASSWORD=test
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASSWORD=
