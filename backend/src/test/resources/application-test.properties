# 为什么需要这个文件：
# 主 application.yml 里 DB_URL、LLM_MODEL 这类占位符故意不给默认值，避免部署时静默连到错误地址或模型；
# 但 @SpringBootTest 要启动完整上下文，这些占位符必须有值，否则 contextLoads 会直接失败。
# 这里只提供测试用的假值。操作系统环境变量优先级高于配置文件，
# 作者本机或 CI 设了真实值时仍然以真实值为准，真实密钥不会进仓库。
LLM_API_KEY=test-api-key
LLM_BASE_URL=http://127.0.0.1:1
LLM_MODEL=test-model
DB_URL=jdbc:mysql://127.0.0.1:3306/link_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
DB_USERNAME=test
DB_PASSWORD=test
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASSWORD=
# 上下文启动测试不启动长期记忆消费者：它会真的去 Redis 取任务并触发模型调用（有成本），
# 单测需要验证消费逻辑时直接构造 MemoryExtractionWorker 调 pollAndProcessOnce()。
agent.memory.extract.worker-enabled=false

# 上下文测试不能启动会物理删除参考数据的定时维护，具体行为由隔离库实测验证。
knowledge.reference-maintenance.enabled=false

# 上下文启动只验证装配；计划抢占和恢复在独立MySQL容器中验证，不能触碰本机任务。
assistant.plan.worker-enabled=false
